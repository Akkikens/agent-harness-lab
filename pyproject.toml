[project]
name = "agent-harness-lab"
version = "0.1.0"
description = "A small agent harness: capability-gated sandboxed tools, durable journaled runs, record/replay eval gating, and an ACP server."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon (skipped otherwise)"]
